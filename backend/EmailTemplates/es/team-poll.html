<!-- i18n: es draft — native-speaker review pending (#77) -->
<div class="content">
    <p class="eyebrow">Nueva encuesta</p>
    <h1>{{TEAM_NAME}} pregunta al equipo.</h1>

    <p>Hola {{RECIPIENT_NAME}}:</p>

    <p><strong>{{TEAM_NAME}}</strong> ha abierto una encuesta y quiere saber tu respuesta:</p>

    <!-- Question card -->
    <div style="border:1px solid #EAE1D2;border-radius:16px;overflow:hidden;margin:22px 0 0;">
        <div style="height:6px;background:linear-gradient(105deg,#F5623A,#7A9B87);line-height:6px;font-size:0;">&nbsp;</div>
        <div style="padding:18px;">
            <p style="margin:0;font-family:'Mona Sans',Arial,sans-serif;font-size:15px;line-height:1.6;color:#3E362B;">{{QUESTION}}</p>
        </div>
    </div>

    <p style="margin:24px 0 4px;">
        <a href="{{POLL_URL}}" class="button">Responder en la página del equipo</a>
    </p>

    <p class="alt-link">
        ¿El botón no funciona? Pega este enlace en tu navegador:<br>
        <a href="{{POLL_URL}}">{{POLL_URL}}</a>
    </p>
</div>
