<!-- i18n: es draft — native-speaker review pending (#77) -->
<div class="content">
    <p class="eyebrow">Noticias de la party</p>
    <h1>Novedades de {{TEAM_NAME}}.</h1>

    <p>Hola {{RECIPIENT_NAME}}:</p>

    <p>Hay una novedad para la party de <strong>{{TEAM_NAME}}</strong> en <strong>{{EVENT_NAME}}</strong>:</p>

    <!-- News excerpt card -->
    <div style="border:1px solid #EAE1D2;border-radius:16px;overflow:hidden;margin:22px 0 0;">
        <div style="height:6px;background:linear-gradient(105deg,#F5623A,#7A9B87);line-height:6px;font-size:0;">&nbsp;</div>
        <div style="padding:18px;">
            <p style="margin:0;font-family:'Mona Sans',Arial,sans-serif;font-size:15px;line-height:1.6;color:#3E362B;">{{NEWS_EXCERPT}}</p>
        </div>
    </div>

    <p style="margin:24px 0 4px;">
        <a href="{{PARTY_URL}}" class="button">Abrir la party</a>
    </p>

    <p class="alt-link">
        ¿El botón no funciona? Pega este enlace en tu navegador:<br>
        <a href="{{PARTY_URL}}">{{PARTY_URL}}</a>
    </p>
</div>
