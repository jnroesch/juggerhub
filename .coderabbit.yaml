# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit review configuration for JuggerHub.
# Reference: https://docs.coderabbit.ai/reference/configuration
#
# The review guidance below restates rules that already live in the project's own
# sources of truth — .specify/memory/constitution.md, DESIGN.md and CLAUDE.md — so a
# reviewer checks them on every pull request. It adds no new rules: where this file
# and those documents disagree, the documents win and this file should be corrected.

language: en-US
tone_instructions: >-
  Be direct and specific: name the file, the rule and the concrete failure it causes.
  Skip praise and restating the diff. Say plainly when a finding is a guess.

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  # PR descriptions are written by hand; keep the generated summary in CodeRabbit's own
  # walkthrough comment instead of editing the description.
  high_level_summary_in_walkthrough: true
  collapse_walkthrough: true
  sequence_diagrams: true
  # Single-maintainer repository: there is nobody else to suggest.
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true

  path_filters:
    # Generated by `dotnet ef migrations add`; the migration's own Up/Down and the model
    # snapshot diff carry the reviewable change.
    - "!backend/Data/Migrations/*.Designer.cs"
    # Static HTML mockups, never shipped.
    - "!wireframes/**"

  path_instructions:
    - path: "backend/**/*.cs"
      instructions: |
        ASP.NET Core on .NET 10 with EF Core and PostgreSQL. Review against the constitution
        (.specify/memory/constitution.md), in particular:
        - Never trust the client: every authorization and validation decision is enforced
          server-side. Check that a response does not reveal that something exists which the
          caller is not allowed to see (a 403 where the codebase answers 404 for private
          team, party and chat resources is a membership oracle).
        - Thin controllers; logic lives in services behind interfaces; no repository layer.
          Responses are DTOs built with explicit `.Select(...)` projections — no object mapper,
          and no entity, email address, token or hash crossing the boundary.
        - Reads use projections and `AsNoTracking()`. Lists paginate through
          `PaginationRequest`/`PagedResult<T>`, or are hard-capped with the cap stated in code.
        - `ExecuteUpdate`/`ExecuteUpdateAsync` bypass the audit interceptor, so every one must
          `SetProperty(x => x.ModifiedDate, ...)`.
        - Multi-step writes run as one delegate through `Database.CreateExecutionStrategy()`,
          with every state mutation inside the delegate (it is replayed on transient faults).
          Side effects — email, push, SignalR, notification fan-out, badge refresh — run after
          the commit, never inside the replayable delegate.
        - State transitions two people can race (approve, answer, accept, remove, claim) are
          conditional `ExecuteUpdate ... WHERE <still valid>` claims or row locks, not
          read-then-save; a lost race answers with a clear status, never a second success.
        - Display names are read through `_db.PlayerProfiles` (it carries the ban query
          filter); the `User.Profile!` navigation misbehaves under that filter.
        - Notification payloads are serialised without a string-enum converter, so an enum in
          a payload is stored as a number — use bool or string fields. When a person is the
          actor of a notification, identify them through the actor column, never by copying
          their name or id into the payload (it would survive their account deletion).
        - User-visible text produced on the server is localised for the recipient (emails via
          the email localizer) or sent as parameters for the client to translate. New English
          prose concatenated on the server is a defect. Refusals the client acts on carry a
          machine-readable `extensions.code`; the client never renders `detail`.
        - Outbound HTTP is registered once with `.AddJuggerHubResilience(config, "<Name>")`
          and a matching configuration section. Hand-rolled retry loops, `Task.Delay`
          backoff, per-client `HttpClient.Timeout`, stacked handlers, or an SDK's own retry
          left on alongside the shared pipeline are review-rejectable. A 429 from our own
          rate limiter is never retried; a provider's 429 is retried honouring `Retry-After`.
        - Endpoints that let any signed-in player create something that reaches another
          person need a rate-limit policy.
        - Logs never contain secrets, tokens, email addresses, chat message text or other
          personal content, request bodies or response bodies.
        - New data tied to a user is erased in `AccountDeletionService.EraseOwnedDataAsync`,
          or its retention after deletion is deliberate and documented.
    - path: "backend/Data/Migrations/*.cs"
      instructions: |
        EF Core migrations. Check that:
        - `Up()` is not empty when the pull request changes the model (an empty migration is
          the signature of `dotnet ef migrations add --no-build` against stale binaries).
        - Delete behaviours (Cascade / Restrict / SetNull) match the entity comments and the
          spec: records that must outlive a user or a team use Restrict or SetNull.
        - Anything that drops or rewrites existing data is intentional and stated in the PR.
        - `Down()` reverses `Up()`.
    - path: "backend/tests/**"
      instructions: |
        xUnit integration tests against a Testcontainers PostgreSQL and fake email, push and
        realtime senders. Flag:
        - fixtures with absolute dates that will silently go stale — use times relative to now;
        - privacy assertions that check a typed DTO where the rule is about the raw JSON the
          client receives (a field that must be absent should be asserted absent in the JSON);
        - existing assertions weakened or deleted without a reason given in the PR.
    - path: "backend/EmailTemplates/**"
      instructions: |
        Transactional email templates: HTML with inline CSS, built on the shared base
        templates. Every template exists in en, de and es with the same placeholders.
        User-supplied values are HTML-encoded. Dates are formatted through the localizer: the
        backend runs with InvariantGlobalization, so a `MMMM` format always spells an English
        month.
    - path: "frontend/apps/web/src/**/*.ts"
      instructions: |
        Angular (standalone, zoneless) with Nx, Tailwind and Transloco. Check that:
        - Anything a template reads to decide what to show or enable is a signal. The app is
          zoneless: a plain field changed in a callback does not re-render, and a `computed()`
          over plain fields never recomputes.
        - DOM measurement and focus after a state change use `afterNextRender`, not a microtask
          or `setTimeout`.
        - Errors branch on HTTP status or on the server's `extensions.code` and show translated
          copy; the server's English `detail` is never rendered.
        - Mutations (POST/PUT/PATCH/DELETE) are never retried automatically; only the retry
          interceptor retries, and only GET/HEAD. A retry after a failure is the user's press.
        - Auth tokens never go into localStorage or sessionStorage.
        - Components keep separate .html, .css and .ts files.
        - No user-visible English string literals — copy comes from the i18n catalogues.
    - path: "frontend/apps/web/src/**/*.html"
      instructions: |
        Angular templates. Review against DESIGN.md (the source of truth for tokens, voice,
        layout, spacing and components); report conflicts rather than inventing a style.
        - One primary (coral) call to action per view; other actions are secondary.
        - Touch targets are at least 44px; small button sizes are not used for primary row
          actions on mobile.
        - Every user-visible string goes through Transloco; nothing is hard-coded in English.
          Remember German runs longer: check that labels still fit at 375px.
        - Interactive elements are real buttons or links with an accessible name; dialogs
          manage focus and close on Escape; menus expose `aria-haspopup`/`aria-expanded`.
        - User content is rendered through interpolation, never `innerHTML`. External links
          opened in a new tab carry `rel="noopener noreferrer"`.
        - Loading, empty and error states exist for anything that loads data.
    - path: "frontend/apps/web/src/**/*.css"
      instructions: |
        Component styles. Use the DESIGN.md tokens and the Tailwind theme; flag raw hex or rgb
        colours, ad-hoc font sizes and spacing values outside the scale.
    - path: "frontend/apps/web/public/i18n/*.json"
      instructions: |
        Translation catalogues (en, de, es). A key added, renamed or removed in one file is
        changed the same way in all three in the same pull request. German and Spanish values
        are real translations, not English copies. Placeholders (`{{ name }}`) match across the
        three. Terminology follows the words the catalogue already uses for the same thing.
    - path: "frontend/apps/web/public/i18n/legal/*.json"
      instructions: |
        Privacy policy, imprint and terms of use. The German text is legally authoritative;
        English and Spanish are informational and must say the same thing. Describe data by
        category, never feature by feature, and never promise what the product does not do.
        Flag any sentence the code in this pull request makes untrue. A change to the terms
        text needs a terms version bump (TermsOptions, appsettings.json and all three
        catalogues together).
    - path: "frontend/nginx.conf.template"
      instructions: |
        nginx for the SPA. Locations for single files (service worker, manifest, analytics
        endpoints) are exact matches (`location = ...`); a prefix match under `/jh-insights`
        would proxy the analytics admin API to the app's origin. Cookies are stripped from
        requests proxied to analytics.
    - path: "infra/**"
      instructions: |
        Terraform for AKS. One definition for every environment, selected by workspace;
        `envs/*.tfvars` may differ only in sizing and configuration, never in the set or shape
        of resources. No secrets in code or tfvars (they come from GitHub Environments). No
        Azure Key Vault. The resource group holding the Terraform state is bootstrapped
        outside Terraform and must never be managed here.
    - path: ".github/workflows/**"
      instructions: |
        GitHub Actions. Least-privilege `permissions:`; secrets are never echoed; untrusted
        input (PR titles, branch names, issue text) is never interpolated directly into
        `run:`; `pull_request_target` is avoided; pull-request builds never push images.
    - path: "**/*.sh"
      instructions: |
        The constitution allows PowerShell (.ps1) scripts only. Flag a new shell script unless
        it is vendored tooling (Spec-Kit extensions, Claude Code hooks).
    - path: "specs/**"
      instructions: |
        Spec-Kit artifacts (spec, plan, tasks, research, checklists). Review only for
        (a) contradictions with the code changed in this pull request, and (b) contradictions
        between spec.md, plan.md and tasks.md. Do not comment on prose style, grammar, wording
        or Markdown formatting.
    - path: "CLAUDE.md"
      instructions: |
        Agent guidance and a running log of feature plans. Review only for statements the code
        in this pull request makes untrue. Do not comment on prose style or length.

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: warning
    issue_assessment:
      mode: warning
    custom_checks:
      - name: ModifiedDate on bulk updates
        mode: warning
        instructions: |
          Consider every `ExecuteUpdate` or `ExecuteUpdateAsync` call in backend/ whose
          expression the pull request touches: the call is added, or any line of it is added,
          changed or removed (a removed `.SetProperty(...)` line counts, even when the line
          naming `ExecuteUpdateAsync` is unchanged). Judge the whole expression as it stands
          after the change. For each such call whose target entity derives from `BaseEntity`
          (backend/Entities), fail unless that call includes
          `.SetProperty(x => x.ModifiedDate, ...)`. Pass if no such call is touched. List every
          failing call with its file and line. Reason: bulk updates bypass the
          AuditFieldsInterceptor (constitution Principle III, quality gate 2).
      - name: Migration matches the model change
        mode: warning
        instructions: |
          Fail if the pull request changes a mapped property, key, relationship or index of an
          entity in backend/Entities or in backend/Data/AppDbContext.cs but adds no migration
          under backend/Data/Migrations. Fail if a migration added by the pull request has an
          empty `Up()` body while such a model change is present (the signature of a migration
          generated with `--no-build`). Otherwise pass.
      - name: User data is erased or kept on purpose
        mode: warning
        instructions: |
          Applies when the pull request adds an entity, or a property on an entity, that
          references a user (a foreign key to the identity user or to PlayerProfile, such as
          UserId, AuthorId, ActorId, VoterId). Pass if the pull request also changes
          backend/Services/Account/AccountDeletionService.cs to erase or neutralise that data,
          or if the entity's doc comment or the feature's spec states that the data is kept
          after account deletion and why. Otherwise fail. Pass if nothing of this kind is added.
      - name: Outbound calls use shared resilience
        mode: warning
        instructions: |
          Applies when the backend diff adds an outbound network call: `AddHttpClient`,
          `new HttpClient`, `HttpClient` injected into a new class, or a third-party SDK client
          that talks to a remote service. Fail if the registration is not chained with
          `.AddJuggerHubResilience(...)` together with a matching configuration section, if the
          diff adds a hand-rolled retry loop, `Task.Delay` backoff or a per-client
          `HttpClient.Timeout`, or if an SDK's built-in retry is left enabled alongside the
          shared pipeline. Apply the same criteria when the diff changes an existing outbound
          client instead of adding one: fail if it removes `.AddJuggerHubResilience(...)` from an
          existing registration, or adds a hand-rolled retry, `Task.Delay` backoff or per-client
          timeout around an existing outbound call. Pass if the diff neither adds an outbound
          call nor changes an existing client's registration or retry behaviour. Reason:
          constitution Principle VII, quality gate 8.
      - name: Translations in all three languages
        mode: warning
        instructions: |
          Applies when the pull request changes frontend/apps/web/public/i18n/*.json or
          frontend/apps/web/public/i18n/legal/*.json. Fail if a key is added, renamed or
          removed in one of en.json, de.json, es.json without the same change in the other two
          files of that directory. Fail if a new German or Spanish value is identical to its
          English value, unless it is a proper noun, a brand, or a word the language borrows
          unchanged. Otherwise pass.

  tools:
    # Specs and plans are long-form prose; style and grammar linting there is noise.
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    # The frontend lints with ESLint (frontend/eslint.config.mjs); a second JS linter with
    # different defaults would contradict it.
    biome:
      enabled: false
    oxc:
      enabled: false
    # Angular templates are not standalone HTML documents (no doctype or title, camelCase
    # property bindings), so HTMLHint's defaults flag every template.
    htmlhint:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - files: ".specify/memory/constitution.md"
        applyTo: "**"
      - files: "DESIGN.md"
        applyTo: "frontend/**"
