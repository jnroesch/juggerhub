services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      secrets:
        - proxy_ca
    container_name: juggerhub-backend
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=database;Port=5432;Database=${DB_NAME:-appdb};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-postgres}
      # SignalR backplane + distributed rate-limit counters (feature 019). Required: the app
      # fails fast without it outside Development, because a missing backplane in a multi-replica
      # deployment is invisible until two users land on different pods.
      - ConnectionStrings__Redis=${REDIS_CONNECTION:-redis:6379}
      - Jwt__Issuer=${JWT_ISSUER:-juggerhub}
      - Jwt__Audience=${JWT_AUDIENCE:-juggerhub}
      - Jwt__SigningKey=${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set in .env}
      - Jwt__AccessTokenLifetimeMinutes=${JWT_ACCESS_TOKEN_LIFETIME_MINUTES:-15}
      - Email__Provider=${EMAIL_PROVIDER:-Smtp}
      - Email__SmtpHost=mailpit
      - Email__SmtpPort=1025
      - "Email__FromAddress=${EMAIL_FROM_ADDRESS:-JuggerHub <hello@juggerhub.local>}"
      - Email__FrontendBaseUrl=${EMAIL_FRONTEND_BASE_URL:-http://localhost:3000}
      - Email__Resend__ApiKey=${EMAIL_RESEND_API_KEY:-}
      # Feature 012 — temporary platform-admin allowlist (comma-separated emails). See GH #21.
      - Admin__Emails=${ADMIN_EMAILS:-}
      # Feature 028 — outbound resilience limits (constitution VII). Passed through even though
      # local email goes to Mailpit over SMTP, so the configuration path itself is exercised
      # locally rather than existing only in deployed environments (Principle V).
      - Resilience__Outbound__Resend__AttemptTimeoutSeconds=${RESILIENCE_RESEND_ATTEMPT_TIMEOUT_SECONDS:-10}
      - Resilience__Outbound__Resend__TotalTimeoutSeconds=${RESILIENCE_RESEND_TOTAL_TIMEOUT_SECONDS:-30}
      - Resilience__Outbound__Resend__MaxRetryAttempts=${RESILIENCE_RESEND_MAX_RETRY_ATTEMPTS:-3}
      - Resilience__Outbound__Resend__BreakerMinimumThroughput=${RESILIENCE_RESEND_BREAKER_MIN_THROUGHPUT:-5}
      # Feature 035 — media object store. `UseDevelopmentStorage=true` deliberately NOT used: that
      # shorthand resolves to 127.0.0.1, which inside a container is the container itself. The
      # endpoint must name the `azurite` service explicitly.
      - MediaStorage__ConnectionString=${MEDIA_STORAGE_CONNECTION:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}
      - MediaStorage__ContainerName=${MEDIA_STORAGE_CONTAINER:-media}
      - Resilience__Outbound__MediaStore__AttemptTimeoutSeconds=${RESILIENCE_MEDIA_ATTEMPT_TIMEOUT_SECONDS:-5}
      - Resilience__Outbound__MediaStore__TotalTimeoutSeconds=${RESILIENCE_MEDIA_TOTAL_TIMEOUT_SECONDS:-15}
      - Resilience__Outbound__MediaStore__MaxRetryAttempts=${RESILIENCE_MEDIA_MAX_RETRY_ATTEMPTS:-2}
      - Resilience__Outbound__MediaStore__BreakerMinimumThroughput=${RESILIENCE_MEDIA_BREAKER_MIN_THROUGHPUT:-10}
    networks:
      - juggerhub-network
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      azurite:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      secrets:
        - proxy_ca
    container_name: juggerhub-frontend
    ports:
      - "3000:80"
    environment:
      # Feature 033 — analytics config applied at CONTAINER START, not at build time. nginx's own
      # envsubst entrypoint renders /etc/nginx/templates/*.template, so the same built image serves
      # every environment (constitution V). Both names are JH_-prefixed on purpose: envsubst
      # substitutes any variable present in the environment, so an unprefixed placeholder could
      # collide with an nginx runtime variable ($host, $uri, ...) and silently corrupt the config.
      #
      # Setting UMAMI_WEBSITE_ID is the whole local switch: `${VAR:+...}` expands to the snippet
      # only when the variable is non-empty, and the ID is nested inside it, so the toggle and the
      # value cannot drift apart. Unset (the default) = empty = nothing injected.
      #
      # The snippet lives here rather than in .env so it is version-controlled and reviewable, and
      # so nobody has to paste 400 characters correctly. EVERY string in it MUST use double
      # quotes: it ends up inside nginx's SINGLE-quoted sub_filter argument, so one ' terminates
      # that argument early and nginx refuses to start. JavaScript treats "" and '' alike; nginx
      # does not.
      #
      # It checks Global Privacy Control and Do Not Track BEFORE injecting, so a user who has
      # signalled either generates no request at all. Umami's own data-do-not-track covers DNT
      # only; GPC is not implemented by the tracker, which is why this guard exists (FR-007).
      # data-exclude-search drops the query string BEFORE the beacon is sent, so it never leaves
      # the browser. Without it Umami stores url_query next to url_path, which meant /sign-in was
      # recorded with returnUrl=%2F — and returnUrl carries deep links such as /players/<handle>.
      # FR-008 decided page PATHS are recorded verbatim; query strings were never part of that
      # decision, so they are excluded rather than quietly inherited from it.
      #
      # Feature 038 appends the session RECORDER inside that same guard. There is no separate
      # switch for it: analytics on means recording on, so the `--profile analytics` stack works
      # with nothing to remember. The runtime switch is the dashboard toggle, which the recorder
      # consults before capturing anything.
      #
      # Inside the guard is not a stylistic choice: the recorder implements NEITHER Do Not Track
      # nor Global Privacy Control — neither string appears in the file, and unlike the tracker it
      # has no data-do-not-track attribute — so this guard is the entire objection mechanism, not
      # defence in depth. Move it out and the only control the privacy policy offers stops working.
      #
      # NO data-host-url, and the path MUST keep its directory. The recorder derives its own
      # endpoints from the DIRECTORY of its own src — /jh-insights/r.js gives it
      # /jh-insights/api/record and /jh-insights/api/websites/<id>/recorder, inside the namespace
      # 033 already owns. A root-level /jh-insights-r.js would derive /api/record, which belongs to
      # the .NET backend, and would fail SILENTLY: a fire-and-forget POST getting a 404.
      - JH_ANALYTICS_HEAD=${UMAMI_WEBSITE_ID:+<script>(function(){var n=navigator;if(n.globalPrivacyControl||n.doNotTrack==="1"||window.doNotTrack==="1")return;var s=document.createElement("script");s.async=true;s.defer=true;s.src="/jh-insights.js";s.setAttribute("data-website-id","${UMAMI_WEBSITE_ID}");s.setAttribute("data-do-not-track","true");s.setAttribute("data-exclude-search","true");document.head.appendChild(s);var r=document.createElement("script");r.async=true;r.src="/jh-insights/r.js";r.setAttribute("data-website-id","${UMAMI_WEBSITE_ID}");document.head.appendChild(r);})();</script>}
      # The website id on its own, because the nginx config location for the recorder's
      # configuration endpoint is an EXACT match and has to contain it. A prefix location would
      # have avoided this variable and proxied Umami's entire API — including /api/auth/login — to
      # the application's origin, undoing 033's decision to keep the dashboard on its own host.
      - JH_ANALYTICS_WEBSITE_ID=${UMAMI_WEBSITE_ID:-}
      - JH_ANALYTICS_UPSTREAM=${JH_ANALYTICS_UPSTREAM:-http://umami:3000}
      # Docker's embedded DNS. nginx proxies the analytics routes through a variable so it
      # resolves them per request instead of at startup — otherwise the frontend could not
      # boot at all with the analytics profile off, since `umami` would not exist.
      - JH_ANALYTICS_RESOLVER=${JH_ANALYTICS_RESOLVER:-127.0.0.11}
    networks:
      - juggerhub-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Use 127.0.0.1 (not localhost) — nginx listens on IPv4 only, and busybox
      # wget would otherwise try IPv6 ::1 and get connection-refused.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  database:
    image: postgres:18.3-alpine
    container_name: juggerhub-database
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-appdb}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ stores data in a major-version-specific subdirectory and
      # expects the volume mounted at /var/lib/postgresql (not .../data, which
      # was the convention up to Postgres 16). See docker-library/postgres#1259.
      - db-data:/var/lib/postgresql
    networks:
      - juggerhub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Redis backs the SignalR backplane and the distributed rate-limit counters (feature 019).
  # It runs LOCALLY as well as in Dev/Prod on purpose: the deployment runs more than one replica,
  # and constitution V limits environment differences to configuration and secrets — never
  # architecture. A local-only in-process fallback would mean local development exercised a
  # different fan-out path than production, which is exactly the class of bug this component
  # exists to prevent. Redis holds no durable state: in-flight fan-out and one-minute counters
  # only, so it needs no volume and losing it costs liveness, never data.
  redis:
    image: redis:8.2-alpine
    container_name: juggerhub-redis
    networks:
      - juggerhub-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Feature 035 (#97) — media object store. Azurite speaks the real Azure Blob REST API, so local,
  # test, Dev and Prod all run ONE code path against one client library (Principle V) rather than a
  # hand-written local fake that can drift from the thing it stands in for.
  #
  # The `devstoreaccount1` account name and key below are PUBLISHED MICROSOFT CONSTANTS — identical
  # on every machine that has ever run the emulator, documented openly, and useless against
  # anything real. Committing them is not a secret leak. Real account keys reach the app only via
  # GitHub Environments → Kubernetes Secret, and never appear in this repository.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    container_name: juggerhub-azurite
    # --location is REQUIRED for the volume below to do anything. Azurite defaults to writing into
    # its own workdir (/opt/azurite), which lives in the container's writable layer — so without
    # this flag the mount is inert and every uploaded picture is destroyed by `docker compose down`.
    #
    # No --skipApiVersionCheck: the backend pins the blob service API version (see Program.cs), so
    # the emulator should reject anything it does not genuinely implement. Skipping the check would
    # let local quietly accept requests it handles differently from real storage — the exact
    # divergence this emulator exists to prevent.
    #
    # --disableTelemetry stops the emulator phoning home to Application Insights. It is opt-OUT,
    # and on a dev machine it only ever produces `EAI_AGAIN ...applicationinsights.azure.com` noise
    # in the log that reads like an application fault. Nothing we run needs it.
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--location", "/data", "--disableTelemetry"]
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data
    networks:
      - juggerhub-network
    healthcheck:
      # Azurite has no shell utilities beyond node, so probe the blob endpoint with node itself.
      # The probe is UNAUTHENTICATED, so Azurite answers it with a 403 — which is a pass, not a
      # fault: the callback exits 0 on any response and only `.on('error')` (nothing listening)
      # fails the check. Expect a steady stream of `"GET /devstoreaccount1?comp=list" 403` in the
      # container log at the interval below; it is this probe, not the backend.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:10000/devstoreaccount1?comp=list',r=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.29.1
    container_name: juggerhub-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      # Points the Mailpit "Spam Analysis" panel at the local SpamAssassin daemon.
      # Mailpit connects lazily (only when a message is scored), so this address can
      # stay set even when spamd isn't running — sa-check simply reports an error
      # instead of a score. spamd itself is opt-in via the `spam` compose profile.
      - MP_ENABLE_SPAMASSASSIN=spamd:783
    networks:
      - juggerhub-network

  # Creates the `umami` role and database, and isolates them from appdb, BEFORE Umami starts —
  # Prisma's migrations fail against a database that does not exist. A one-shot service rather
  # than /docker-entrypoint-initdb.d/, which only runs when initialising an EMPTY data directory
  # and so would be a silent no-op on an existing local volume, exactly as it would be on the
  # already-initialised Dev and Prod volumes. This mirrors the Kubernetes initContainer, so the
  # same SQL is exercised locally as in Dev/Prod.
  umami-db-init:
    image: postgres:18.3-alpine
    container_name: juggerhub-umami-db-init
    profiles:
      - analytics
    environment:
      PGPASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - ./scripts:/scripts:ro
    command: >
      psql -h database -U ${DB_USER:-postgres} -d postgres
           -v ON_ERROR_STOP=1
           -v umami_password=${UMAMI_DB_PASSWORD:-umami}
           -v app_db=${DB_NAME:-appdb}
           -f /scripts/umami-db-init.sql
    networks:
      - juggerhub-network
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  # Self-hosted Umami analytics (feature 033). Opt-in via the `analytics` profile
  # (`docker compose --profile analytics up`), mirroring the `spam` profile below: a plain
  # `docker compose up` must stay exactly as light as it was before this feature existed.
  #
  # It runs LOCALLY as well as in Dev/Prod because constitution V limits environment differences
  # to configuration and sizing, never the set of resources — and because the local stack runs the
  # *identical* Postgres image, which is what let the PostgreSQL 18 compatibility question be
  # settled in ten minutes instead of after the Terraform was written.
  #
  # Data lives in its own `umami` database on the SAME Postgres instance, owned by a non-superuser
  # role that is explicitly revoked from the application database. See scripts/umami-db-init.sql.
  umami:
    # NOTE the tag scheme: v3 DROPPED the `postgresql-` prefix and the `v` that every 1.x/2.x tag
    # carried (PostgreSQL is the only supported database in v3), so the plausible-looking
    # `postgresql-v3.2.0` does not exist and fails at pull with a bare "not found".
    image: docker.umami.is/umami-software/umami:3.2.0
    container_name: juggerhub-umami
    profiles:
      - analytics
    ports:
      # 3001 because the frontend already owns 3000 on the host.
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://umami:${UMAMI_DB_PASSWORD:-umami}@database:5432/umami
      # A local default rather than the `:?` required-variable guard used for
      # JWT_SIGNING_KEY: compose interpolates the WHOLE file regardless of profiles, so `:?`
      # here would abort a plain `docker compose up` for anyone whose .env predates this
      # feature — even though this service never starts for them (FR-019). Nothing is lost:
      # deployed environments read APP_SECRET from a Kubernetes Secret, never from compose.
      - APP_SECRET=${UMAMI_APP_SECRET:-local-dev-only-not-a-real-secret}
      # Moves the beacon off /api/send. REQUIRED, not cosmetic: the tracker posts to this path on
      # OUR origin, and /api/ there is already proxied to the .NET backend. This variable rewrites
      # the URL embedded in script.js at container start.
      #
      # NOTE: it does NOT create a server route — Umami still accepts beacons at /api/send only.
      # The frontend nginx maps /jh-insights/e -> /api/send. Verified empirically; the docs imply
      # otherwise. TRACKER_SCRIPT_NAME is deliberately NOT set: it has no effect in this image
      # (standalone Next.js build, rewrites baked at build time), so nginx renames the script too.
      - COLLECT_API_ENDPOINT=/jh-insights/e
      # No outbound call-home, no update checks: the version is pinned by us (FR-009).
      - DISABLE_TELEMETRY=1
      - DISABLE_UPDATES=1
    networks:
      - juggerhub-network
    depends_on:
      database:
        condition: service_healthy
      umami-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Creates the tracked website row with the id we CHOSE, rather than making someone create it in
  # the dashboard and copy the generated id back into configuration. That manual step is what
  # would otherwise leave a fresh stack — and every fresh environment — silently measuring
  # nothing until a human noticed. See scripts/umami-seed-website.sql.
  #
  # Runs AFTER Umami is healthy because the `website` and `user` tables do not exist until Prisma
  # has migrated and the admin account has been seeded. That ordering is why this cannot be folded
  # into umami-db-init above.
  umami-seed-website:
    image: postgres:18.3-alpine
    container_name: juggerhub-umami-seed-website
    profiles:
      - analytics
    environment:
      PGPASSWORD: ${UMAMI_DB_PASSWORD:-umami}
    volumes:
      - ./scripts:/scripts:ro
    command: >
      psql -h database -U umami -d umami
           -v ON_ERROR_STOP=1
           -v website_id=${UMAMI_WEBSITE_ID:-a1b2c3d4-0000-4000-8000-000000000033}
           -v website_name=JuggerHub
           -v website_domain=localhost:3000
           -f /scripts/umami-seed-website.sql
    networks:
      - juggerhub-network
    depends_on:
      umami:
        condition: service_healthy
    restart: "no"

  # Feature 038 — the recording retention statement, available locally so the mechanism that
  # enforces the privacy policy's "kept 30 days" is the SAME text in all three environments
  # (constitution V), not a cluster-only artefact nobody can exercise before deploying it.
  #
  # Deployed environments run this on a daily CronJob. Locally it is a ONE-SHOT you invoke, because
  # a local stack is not up long enough for a schedule to mean anything and a background deleter
  # would only make local test data vanish mid-investigation:
  #
  #     docker compose --profile analytics run --rm umami-replay-retention
  #
  # To exercise it properly — including the straddling-session case that a naive row-wise delete
  # gets wrong — backdate some session_replay.created_at values first. See quickstart scenario 7.
  umami-replay-retention:
    image: postgres:18.3-alpine
    container_name: juggerhub-umami-replay-retention
    profiles:
      - analytics
    # Never starts with the stack: `docker compose up` must not delete anything. It runs only when
    # invoked explicitly with `run`.
    scale: 0
    environment:
      PGPASSWORD: ${UMAMI_DB_PASSWORD:-umami}
    volumes:
      - ./scripts:/scripts:ro
    command: >
      psql -h database -U umami -d umami
           -v ON_ERROR_STOP=1
           -v retention_days=${UMAMI_REPLAY_RETENTION_DAYS:-30}
           -f /scripts/umami-replay-retention.sql
    networks:
      - juggerhub-network
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  # SpamAssassin spamd, consumed only by Mailpit for local spam scoring. Opt-in:
  # it costs a few hundred MB of RAM, so it only starts under the `spam` profile
  # (`docker compose --profile spam up`), not on a plain `docker compose up`.
  spamd:
    image: instantlinux/spamassassin:latest
    container_name: juggerhub-spamd
    profiles:
      - spam
    networks:
      - juggerhub-network

networks:
  juggerhub-network:
    driver: bridge

volumes:
  db-data:
  azurite-data:

# Optional egress-proxy CA, consumed by the image builds (backend/frontend Dockerfiles).
# Defaults to the committed ZERO-BYTE .proxy-ca-empty so ordinary local builds and CI mount
# an EMPTY secret and the CA steps are no-ops. Behind a TLS-terminating egress proxy (e.g.
# Claude Code on the web), point PROXY_CA_FILE at the proxy's CA bundle — the .claude
# SessionStart hook does this automatically — and every `docker compose build`/`up --build`/
# test run trusts it.
#
# The default is a real file, NOT /dev/null: compose stats secret files on the HOST, so a
# Unix device path aborts every build on Windows ("failed to stat /dev/null") before any
# Dockerfile step runs — and it takes the frontend build down with it, though only the
# backend uses the CA. Local CI is Linux, so nothing but a Windows checkout catches this.
#
# .proxy-ca-empty MUST stay zero bytes. The Dockerfiles guard on `[ -s ... ]` (size, not
# existence), so an empty file is skipped — but add so much as a comment line to it and the
# builds would install it as a trusted root and run update-ca-certificates over non-PEM text.
secrets:
  proxy_ca:
    file: ${PROXY_CA_FILE:-./.proxy-ca-empty}
