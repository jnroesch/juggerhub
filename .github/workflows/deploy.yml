name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed
    branches: [main]

# Deploy jobs pull the images published by the Build workflow from GHCR and run
# `terraform apply` against AKS. id-token:write is required for Azure OIDC login;
# actions:read lets the e2e gate query the E2E workflow's run for this commit.
permissions:
  contents: read
  packages: read
  id-token: write
  actions: read

# Serialize deploys so two runs can't race on the same environment.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.12.2"

jobs:
  # --- gate: nothing deploys until E2E is green for THIS commit ---------------
  # Build and E2E are separate workflows triggered by the same push, so they run
  # in parallel and Build finishing tells us nothing about E2E. This job polls the
  # E2E workflow run for the same head SHA and fails if it is not successful, so a
  # red e2e suite on main blocks the rollout instead of only being visible in the
  # Actions tab. Both deploy jobs hang off it (deploy-prod via `needs: deploy-dev`).
  e2e-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # workflow_run fires on completion regardless of result; only proceed when the
    # Build workflow actually succeeded. Manual runs (workflow_dispatch) have no
    # workflow_run payload, so conclusion is empty — allow those through too.
    # Skipping here skips the deploy jobs with it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Wait for E2E to succeed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # The commit Build ran against — the same commit E2E ran against.
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -uo pipefail
          echo "Waiting for the E2E workflow on ${HEAD_SHA}"
          # Both workflows are queued by the same event, so the run normally exists
          # already; keep waiting rather than failing fast if it has not appeared yet.
          deadline=$(( $(date +%s) + 45 * 60 ))
          while :; do
            info="$(gh api \
              "repos/${REPO}/actions/workflows/e2e.yml/runs?head_sha=${HEAD_SHA}&per_page=1" \
              --jq '.workflow_runs[0] // {} | "\(.status // "missing") \(.conclusion // "none")"' \
              2>/dev/null || echo "apierror none")"
            status="${info%% *}"
            conclusion="${info##* }"
            echo "status=${status} conclusion=${conclusion}"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "E2E is green — proceeding with the deploy."
                exit 0
              fi
              echo "::error::E2E concluded '${conclusion}' for ${HEAD_SHA}; refusing to deploy."
              exit 1
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for E2E on ${HEAD_SHA} (last status: ${status})."
              exit 1
            fi
            sleep 30
          done

  # --- dev: runs once Build succeeds and E2E is green (or on manual dispatch) --
  deploy-dev:
    runs-on: ubuntu-latest
    environment: development
    # The Build-succeeded / manual-dispatch condition lives on e2e-gate; a skipped
    # gate skips this job too.
    needs: e2e-gate

    env:
      TF_WORKSPACE_ENV: dev
      TFVARS: envs/dev.tfvars
      # Terraform azurerm auth (backend + provider) via the CI service principal (OIDC).
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Secrets injected as Terraform variables (from the `development` Environment).
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
      TF_VAR_jwt_signing_key: ${{ secrets.JWT_SIGNING_KEY }}
      TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY }}
      TF_VAR_admin_emails: ${{ secrets.ADMIN_EMAILS }}
      TF_VAR_ghcr_pull_token: ${{ secrets.GHCR_PULL_TOKEN }}
      # Analytics (feature 033). All three are required — Terraform has no defaults for them, so a
      # missing one fails THIS environment at apply with an unset-variable error. Deliberate: the
      # alternative is a shared default signing key or a dashboard left on its seeded credential.
      # UMAMI_ADMIN_PASSWORD_HASH is the bcrypt hash only; the plaintext never leaves the
      # Environment. The website ID is not here — it is not a secret and lives in envs/*.tfvars.
      TF_VAR_umami_db_password: ${{ secrets.UMAMI_DB_PASSWORD }}
      TF_VAR_umami_app_secret: ${{ secrets.UMAMI_APP_SECRET }}
      TF_VAR_umami_admin_password_hash: ${{ secrets.UMAMI_ADMIN_PASSWORD_HASH }}

    steps:
      - uses: actions/checkout@v7

      - name: Resolve image tag (matches build.yml `type=sha`)
        id: img
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "tag=sha-${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # NOTE: the FIRST provisioning of an environment (empty subscription) is done
      # manually by an operator — see infra/README (two-phase apply for a fresh
      # cluster). This pipeline handles ongoing rollouts, where only image_tag changes.
      - name: Terraform apply
        working-directory: infra
        run: |
          terraform init
          terraform workspace select "$TF_WORKSPACE_ENV" || terraform workspace new "$TF_WORKSPACE_ENV"
          VARS=(-input=false -auto-approve
            -var-file="$TFVARS"
            -var="image_tag=${{ steps.img.outputs.tag }}"
            -var="image_repo_backend=ghcr.io/${{ github.repository }}/backend"
            -var="image_repo_frontend=ghcr.io/${{ github.repository }}/frontend"
            -var="ghcr_username=${{ github.repository_owner }}")
          # Phase 1 (fresh cluster only; a no-op on every later run): create the
          # cluster + platform Helm charts so cert-manager's CRDs exist BEFORE the
          # ClusterIssuer manifests are planned. Avoids the kubernetes_manifest
          # "cannot connect / CRD not found" failure on first apply.
          terraform apply "${VARS[@]}" \
            -target=module.network -target=module.aks \
            -target=azurerm_role_assignment.aks_ingress_ip \
            -target=module.platform.helm_release.ingress_nginx \
            -target=module.platform.helm_release.cert_manager
          # Phase 2: converge everything (issuers + app + ingress).
          terraform apply "${VARS[@]}"

      - name: Smoke test
        working-directory: infra
        run: |
          RG="rg-juggerhub-${TF_WORKSPACE_ENV}"
          CLUSTER="aks-juggerhub-${TF_WORKSPACE_ENV}"
          az aks get-credentials -g "$RG" -n "$CLUSTER" --overwrite-existing
          kubectl -n juggerhub rollout status deploy/backend --timeout=180s
          kubectl -n juggerhub rollout status deploy/frontend --timeout=180s
          kubectl -n juggerhub rollout status statefulset/postgres --timeout=180s
          HOST="$(terraform output -raw ingress_host)"
          # Best-effort: cert/DNS may still be settling on a brand-new host.
          curl -fsS --retry 5 --retry-delay 10 "https://${HOST}/api/v1/health" || \
            echo "::warning::health check not green yet (DNS/cert may still be propagating)"

  # --- prod: only after dev succeeds, gated by manual approval ----------------
  # DISABLED: prod deploys are currently done manually, and the `production`
  # Environment's Required-reviewers rule leaves this job waiting for an approval
  # that never comes — blocking the `deploy-${{ github.ref }}` concurrency group
  # (cancel-in-progress: false) so the next Deploy run can't start. Commented out
  # so a successful dev deploy ends the run cleanly and the next push can deploy.
