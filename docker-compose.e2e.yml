# Isolation overlay for the containerized e2e suite. Layer it AFTER the base and
# test overlays and run under a dedicated project name so a full throwaway stack
# (with its own disposable database) can come up without colliding with a running
# dev stack:
#
#   docker compose -p juggerhub-e2e \
#     -f docker-compose.yml -f docker-compose.test.yml -f docker-compose.e2e.yml \
#     run --rm playwright
#
# Two things in the base file are global to the daemon and would otherwise clash
# with a running dev stack: the pinned `container_name`s (unique per daemon, not
# per project) and the published host `ports`. This overlay resets both — every
# service still reaches the others by name over the internal network, and the
# playwright container talks to `frontend:80` / `mailpit:8025` directly.
services:
  backend:
    container_name: !reset null
    ports: !reset []

  frontend:
    container_name: !reset null
    ports: !reset []

  database:
    container_name: !reset null
    ports: !reset []

  mailpit:
    container_name: !reset null
    ports: !reset []

  # Added when the SignalR backplane and distributed rate limiter landed (019); the overlay was
  # not updated with it, so running e2e while a dev stack was up failed at
  # `Conflict. The container name "/juggerhub-redis" is already in use` before a single test ran.
  #
  # Only services that start WITHOUT a profile need resetting here: `spamd` and the analytics
  # services carry pinned names too, but they never start for an e2e run.
  redis:
    container_name: !reset null
    ports: !reset []

  # Feature 035 — same reasoning as redis above: azurite carries a pinned container name and
  # publishes port 10000, both of which are daemon-global and would collide with a running dev
  # stack. Reset here or an e2e run fails at
  # `Conflict. The container name "/juggerhub-azurite" is already in use` before any test starts.
  azurite:
    container_name: !reset null
    ports: !reset []
