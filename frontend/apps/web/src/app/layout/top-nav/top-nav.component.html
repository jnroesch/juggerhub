<header
  class="sticky top-0 z-30 flex h-14 items-center gap-sm border-b border-border bg-surface px-md"
>
  <!-- Brand -->
  <a routerLink="/" class="flex items-center gap-xs" [attr.aria-label]="'nav.brandHome' | transloco">
    <span class="grid h-7 w-7 place-items-center rounded-md bg-brand-gradient shadow-sm" aria-hidden="true">
      <span class="h-1.5 w-1.5 rounded-pill bg-highlight"></span>
    </span>
    <span class="font-display text-h4 font-bold text-ink">JuggerHub</span>
  </a>

  <!-- Desktop: primary destinations -->
  <nav class="ml-lg hidden items-center gap-xs md:flex" [attr.aria-label]="'nav.primary' | transloco">
    <a
      routerLink="/"
      class="flex items-center gap-xs rounded-md px-sm py-xs text-body-sm font-medium transition-colors duration-fast"
      [class]="homeActive() ? 'bg-surface-accent-soft text-brand-strong font-semibold' : 'text-text hover:bg-surface-sunken'"
      [attr.aria-current]="homeActive() ? 'page' : null"
      data-testid="nav-home"
    >
      <jh-icon name="house" />
      {{ 'nav.home' | transloco }}
    </a>
    <a
      routerLink="/browse"
      class="flex items-center gap-xs rounded-md px-sm py-xs text-body-sm font-medium transition-colors duration-fast"
      [class]="browseActive() ? 'bg-surface-accent-soft text-brand-strong font-semibold' : 'text-text hover:bg-surface-sunken'"
      [attr.aria-current]="browseActive() ? 'page' : null"
      data-testid="nav-browse"
    >
      <jh-icon name="search" />
      {{ 'nav.browse' | transloco }}
    </a>
    <a
      [routerLink]="myTeamHref()"
      class="flex items-center gap-xs rounded-md px-sm py-xs text-body-sm font-medium transition-colors duration-fast"
      [class]="myTeamActive() ? 'bg-surface-accent-soft text-brand-strong font-semibold' : 'text-text hover:bg-surface-sunken'"
      [attr.aria-current]="myTeamActive() ? 'page' : null"
      data-testid="nav-my-team"
    >
      <jh-icon name="users" />
      {{ 'nav.myTeam' | transloco }}
    </a>
    <a
      routerLink="/chat"
      class="flex items-center gap-xs rounded-md px-sm py-xs text-body-sm font-medium transition-colors duration-fast"
      [class]="chatActive() ? 'bg-surface-accent-soft text-brand-strong font-semibold' : 'text-text hover:bg-surface-sunken'"
      [attr.aria-current]="chatActive() ? 'page' : null"
      [attr.aria-label]="chatBadge() ? ('nav.unreadLabel' | transloco: { label: ('nav.chat' | transloco), count: chatBadge() }) : ('nav.chat' | transloco)"
      data-testid="nav-chat"
    >
      <span class="relative">
        <jh-icon name="message-circle" />
        @if (chatBadge(); as badge) {
          <span
            class="absolute -right-2 -top-1.5 grid h-5 min-w-5 place-items-center rounded-pill bg-brand-strong px-1 font-mono text-caption font-bold leading-none text-on-accent"
            aria-hidden="true"
            data-testid="nav-chat-badge"
          >{{ badge }}</span>
        }
      </span>
      {{ 'nav.chat' | transloco }}
    </a>
  </nav>

  <!-- Right side: bell + avatar (desktop) / avatar (mobile strip — Alerts lives in the bottom tab bar). Language lives in account settings when signed in. -->
  <div class="ml-auto flex items-center gap-sm">
    <a
      routerLink="/alerts"
      class="relative hidden h-9 w-9 place-items-center rounded-md transition-colors duration-fast focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focus md:grid"
      [class]="alertsActive() ? 'bg-surface-accent-soft text-brand-strong' : 'text-text hover:bg-surface-sunken'"
      [attr.aria-current]="alertsActive() ? 'page' : null"
      [attr.aria-label]="alertsBadge() ? ('nav.unreadLabel' | transloco: { label: ('nav.alerts' | transloco), count: alertsBadge() }) : ('nav.alerts' | transloco)"
      data-testid="nav-alerts-bell"
    >
      <jh-icon name="bell" />
      @if (alertsBadge(); as badge) {
        <span
          class="absolute -right-0.5 -top-0.5 grid h-5 min-w-5 place-items-center rounded-pill bg-brand-strong px-1 text-caption font-bold leading-none text-on-accent"
          aria-hidden="true"
          data-testid="nav-alerts-badge"
        >{{ badge }}</span>
      }
    </a>
    <jh-avatar-menu />
  </div>
</header>
