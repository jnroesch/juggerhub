<div class="flex flex-col gap-md">
  <label class="block text-body-sm font-medium text-heading">
    {{ 'trainings.form.venue' | transloco }}
    <span class="text-caption font-normal text-muted">{{ 'trainings.form.optional' | transloco }}</span>
    <input
      [ngModel]="venueName()"
      (ngModelChange)="venueName.set($event)"
      name="venueName"
      type="text"
      maxlength="120"
      [attr.data-testid]="testIdPrefix() + '-venue'"
      [placeholder]="'trainings.form.venuePlaceholder' | transloco"
      class="mt-xs w-full rounded-md border border-border-strong bg-surface-card px-md py-sm text-body-md font-normal text-body outline-none focus:border-brand focus:ring-2 focus:ring-focus"
    />
  </label>

  <label class="block text-body-sm font-medium text-heading">
    {{ 'trainings.form.street' | transloco }}
    <input
      [ngModel]="street()"
      (ngModelChange)="street.set($event)"
      name="street"
      type="text"
      maxlength="160"
      required
      [attr.data-testid]="testIdPrefix() + '-street'"
      [placeholder]="'trainings.form.streetPlaceholder' | transloco"
      class="mt-xs w-full rounded-md border border-border-strong bg-surface-card px-md py-sm text-body-md font-normal text-body outline-none focus:border-brand focus:ring-2 focus:ring-focus"
    />
  </label>

  <label class="block text-body-sm font-medium text-heading">
    {{ 'trainings.form.postalCode' | transloco }}
    <input
      [ngModel]="postalCode()"
      (ngModelChange)="postalCode.set($event)"
      name="postalCode"
      type="text"
      maxlength="20"
      required
      [attr.data-testid]="testIdPrefix() + '-postal'"
      [placeholder]="'trainings.form.postalPlaceholder' | transloco"
      class="mt-xs w-full rounded-md border border-border-strong bg-surface-card px-md py-sm text-body-md font-normal text-body outline-none focus:border-brand focus:ring-2 focus:ring-focus"
    />
  </label>

  <div [attr.data-testid]="testIdPrefix() + '-city'">
    <span class="block text-body-sm font-medium text-heading">{{ 'trainings.form.city' | transloco }}</span>
    <div class="mt-xs">
      <jh-city-picker
        [initial]="initialCity()"
        [placeholder]="'trainings.form.cityPlaceholder' | transloco"
        (selectedChange)="onCitySelected($event)"
      />
    </div>
  </div>
</div>
