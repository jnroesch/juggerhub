<div class="min-w-0 flex-1">
  @if (editing()) {
    <!-- Edited in place (feature 057). Save is secondary: the page's own composer keeps the one
         coral CTA in this view. -->
    <div data-testid="news-editor">
      <textarea
        rows="3"
        [attr.maxlength]="maxLength()"
        [value]="draft()"
        (input)="draft.set($any($event.target).value)"
        [attr.aria-label]="'news.editLabel' | transloco"
        data-testid="news-edit-input"
        class="w-full resize-y rounded-md border border-border-default bg-surface-card px-md py-sm text-body-sm text-body placeholder:text-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focus"
      ></textarea>
      <p class="mt-xs text-caption text-muted">{{ editHint() | transloco }}</p>
      @if (editError(); as key) {
        <p class="mt-xs text-body-sm text-danger-fg" role="alert" data-testid="news-edit-error">{{ key | transloco }}</p>
      }
      <div class="mt-sm flex flex-wrap justify-end gap-sm">
        <button type="button" jhButton variant="ghost" size="sm" [disabled]="saving()" (click)="cancelEdit()" data-testid="news-edit-cancel">
          {{ 'common.cancel' | transloco }}
        </button>
        <button type="button" jhButton variant="secondary" size="sm" [disabled]="saving() || !draft().trim()" (click)="saveEdit()" data-testid="news-edit-save">
          {{ (saving() ? 'news.saving' : 'common.save') | transloco }}
        </button>
      </div>
    </div>
  }
  <!-- The host's own body and meta line. Hidden, never destroyed, while the editor is open:
       projected content is created once, so it must not sit inside an @if. -->
  <div [hidden]="editing()">
    <ng-content />
  </div>
</div>

<!-- The server decides who may edit or delete; this is convenience. Disabled while a post on this
     page is being edited, so choosing another post can never silently throw away the text being
     typed. -->
@if (canManage()) {
  <div class="relative shrink-0" data-news-menu>
    <button
      type="button"
      class="inline-flex h-11 w-11 items-center justify-center rounded-md text-muted transition-colors duration-fast hover:bg-surface-sunken hover:text-body focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focus disabled:opacity-50"
      aria-haspopup="menu"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="'news.manage' | transloco"
      [attr.data-news-menu-trigger]="postId()"
      [disabled]="locked()"
      (click)="toggleMenu()"
    >
      <jh-icon name="ellipsis" size="sm" />
    </button>
    @if (menuOpen()) {
      <div class="absolute right-0 z-10 mt-1 min-w-40 rounded-md border border-border-default bg-surface-card py-xs shadow-md" role="menu" data-testid="news-menu">
        <button type="button" role="menuitem" (click)="startEdit()" data-testid="news-edit"
          class="flex min-h-11 w-full items-center px-md text-left text-body-sm text-body hover:bg-surface-sunken focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focus">
          {{ 'news.edit' | transloco }}
        </button>
        <button type="button" role="menuitem" (click)="askDelete()" data-testid="news-delete"
          class="flex min-h-11 w-full items-center px-md text-left text-body-sm text-danger-fg hover:bg-surface-sunken focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focus">
          {{ 'news.delete' | transloco }}
        </button>
      </div>
    }
  </div>
}

<!-- Delete a post (feature 057): asked through the shared confirmation dialog (GH #392), which owns the
     focus and keyboard rules. It is fixed, and no ancestor on a news page transforms, so the card the
     post sits in does not clip it. -->
@if (confirming()) {
  <jh-confirm-dialog
    [heading]="'news.deleteTitle' | transloco"
    [body]="deleteBody() | transloco"
    [keepLabel]="'news.deleteKeep' | transloco"
    [confirmLabel]="'news.deleteConfirm' | transloco"
    [busyLabel]="'news.deleting' | transloco"
    [busy]="deleting()"
    [error]="deleteError() ? (deleteError()! | transloco) : null"
    (confirmed)="confirmDelete()"
    (dismissed)="dismissDelete()"
  />
}
