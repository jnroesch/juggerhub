<div class="flex flex-wrap gap-xs" role="group" [attr.aria-label]="'profile.pompfeSelector.aria' | transloco">
  @for (entry of catalog; track entry.value) {
    <button
      type="button"
      (click)="toggle(entry.value)"
      [attr.aria-pressed]="isSelected(entry.value)"
      [attr.data-testid]="'pompfe-' + entry.value"
      [attr.data-selected]="isSelected(entry.value)"
      jhChip
      [tone]="isSelected(entry.value) ? 'secondary' : 'outline'"
    >
      {{ entry.labelKey | transloco }}
    </button>
  }
</div>
