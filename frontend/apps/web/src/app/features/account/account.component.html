<div class="p-md sm:p-xl">
  <div class="mx-auto w-full max-w-3xl" data-testid="account">
    <h1 class="text-heading-lg font-semibold text-ink">{{ 'account.title' | transloco }}</h1>
    <p class="mt-xs text-body-sm text-subtle">
      {{ 'account.subtitle' | transloco }}
    </p>
    @if (user(); as currentUser) {
      <p class="mt-md text-body-md text-text" data-testid="account-email">
        {{ 'account.signedInAs' | transloco }} <span class="font-medium text-ink">{{ currentUser.email }}</span>.
      </p>
    }

    <div
      class="mt-lg flex items-center justify-between gap-md rounded-md border border-border-muted bg-surface-card px-md py-sm"
      data-testid="account-language"
    >
      <span class="text-body-sm font-medium text-ink">{{ 'common.language' | transloco }}</span>
      <jh-language-switcher />
    </div>

    <a
      routerLink="/settings/notifications"
      class="mt-sm inline-flex items-center gap-xs rounded-md px-sm py-xs text-body-sm font-medium text-link transition-colors duration-fast hover:bg-surface-sunken focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focus"
      data-testid="account-notification-settings"
    >
      {{ 'account.notificationSettings' | transloco }}
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </a>

    <!--
      Legal links for signed-in members (feature 036). Signed-out visitors get these in the app
      footer on every screen; once you have an account they live here instead of following you
      around the app.
    -->
    <div class="mt-lg border-t border-border-muted pt-md">
      <jh-legal-links variant="inline" />
    </div>
  </div>
</div>
