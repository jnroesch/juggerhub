@if (open()) {
  <!-- Backdrop -->
  <button
    type="button"
    class="fixed inset-0 z-40 bg-surface-inverse/40"
    [attr.aria-label]="'browse.filterPanel.close' | transloco"
    (click)="closePanel.emit()"
    data-testid="filter-backdrop"
  ></button>

  <!-- Sheet (mobile) / drawer (desktop) -->
  <div
    #panel
    animate.enter="jh-pop"
    animate.leave="jh-leave"
    class="fixed inset-x-0 bottom-0 z-50 flex origin-bottom md:origin-right max-h-[85vh] flex-col gap-md rounded-t-lg border-t border-border-default bg-surface-card p-md shadow-coral md:inset-y-0 md:left-auto md:right-0 md:max-h-none md:w-80 md:rounded-none md:border-l md:border-t-0"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="'browse.filters' | transloco"
    data-testid="filter-panel"
    (keydown.tab)="onTab($any($event))"
    (keydown.shift.tab)="onTab($any($event))"
  >
    <div class="flex items-center justify-between">
      <h2 class="text-body-md font-semibold text-heading">{{ 'browse.filters' | transloco }}</h2>
      <button
        type="button"
        class="text-body-sm text-link underline hover:text-link-hover"
        (click)="resetFilters.emit()"
        data-testid="filter-reset"
      >{{ 'browse.filterPanel.reset' | transloco }}</button>
    </div>

    <!-- Page-specific filter controls -->
    <div class="flex flex-col gap-md overflow-y-auto">
      <ng-content></ng-content>
    </div>

    <button
      type="button"
      jhButton class="mt-auto"
      (click)="apply.emit()"
      data-testid="filter-apply"
    >
      @let count = pendingCount();
      @if (count === null) {
        {{ 'browse.filterPanel.show' | transloco:{ noun: resultNoun() } }}
      } @else {
        {{ showCountKey() | pluralKey: count | transloco:{ count: count } }}
      }
    </button>
  </div>
}
