<jh-card
  padding="dense"
  class="flex gap-md transition-colors duration-fast"
  [class.opacity-80]="notification().isRead"
  [attr.aria-label]="title()"
>
  <!-- Type icon -->
  <span
    class="grid h-11 w-11 shrink-0 place-items-center rounded-md"
    [class]="
      kind() === 'TeamInvite'
        ? 'bg-surface-accent-soft text-brand-strong'
        : kind() === 'TeamRoleChanged'
          ? 'bg-info-bg text-info-fg'
          : 'bg-surface-secondary-soft text-secondary-strong'
    "
    aria-hidden="true"
  >
    @switch (kind()) {
      @case ('TeamInvite') {
        <jh-icon name="mail" size="lg" />
      }
      @case ('TeamRoleChanged') {
        <jh-icon name="shield-check" size="lg" />
      }
      @default {
        <jh-icon name="volume-2" size="lg" />
      }
    }
  </span>

  <!-- Body -->
  <div class="min-w-0 flex-1">
    @if (link(); as href) {
      <a
        [routerLink]="href"
        (click)="open.emit()"
        class="block rounded-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focus"
      >
        <p class="text-body-sm font-semibold text-heading">{{ title() }}</p>
        <p class="mt-0.5 truncate text-body-sm text-muted">{{ supporting() }}</p>
      </a>
    } @else {
      <p class="text-body-sm font-semibold text-heading">{{ title() }}</p>
      <p class="mt-0.5 text-body-sm text-muted">{{ supporting() }}</p>
    }

    <p class="mt-1 text-caption text-muted">{{ time() }}</p>

    @if (actionable()) {
      <div class="mt-md flex items-center gap-sm">
        <button
          type="button"
          (click)="accept.emit()"
          jhButton size="sm"
          data-testid="notif-accept"
        >
          {{ 'common.accept' | transloco }}
        </button>
        <button
          type="button"
          (click)="decline.emit()"
          jhButton
          variant="secondary"
          size="sm"
          data-testid="notif-decline"
        >
          {{ 'common.decline' | transloco }}
        </button>
      </div>
    }
  </div>

  <!-- Unread marker -->
  @if (!notification().isRead) {
    <span class="mt-1.5 h-2.5 w-2.5 shrink-0 rounded-pill bg-brand" [attr.aria-label]="'alerts.row.unread' | transloco"></span>
  }
</jh-card>
