<section class="mx-auto max-w-container-md px-md py-lg">
  <h1 class="text-h3 text-heading">{{ 'home.news' | transloco }}</h1>
  <p class="mt-xs text-body-sm text-muted">{{ 'home.newsSubtitle' | transloco }}</p>

  @if (items().length > 0) {
    <div class="mt-lg rounded-lg border border-border-muted bg-surface-card p-md shadow-sm">
      <jh-news-list [news]="items()" />
    </div>
  } @else if (!loading() && !failed()) {
    <jh-empty-state class="mt-lg">{{ 'home.noNews' | transloco }}</jh-empty-state>
  }

  @if (failed()) {
    <div class="mt-lg text-center">
      <p class="text-body-sm text-muted">{{ 'home.loadFeedError' | transloco }}</p>
      <button type="button" class="mt-sm rounded-md border border-border-strong bg-surface px-lg py-xs font-medium text-text hover:bg-surface-sunken" (click)="loadMore()">{{ 'common.tryAgain' | transloco }}</button>
    </div>
  } @else if (loading()) {
    <jh-loading align="center" />
  } @else if (hasMore()) {
    <div class="mt-md text-center">
      <button type="button" class="rounded-md border border-border-strong bg-surface px-lg py-xs font-medium text-text hover:bg-surface-sunken" (click)="loadMore()">{{ 'home.loadMore' | transloco }}</button>
    </div>
  }
</section>
