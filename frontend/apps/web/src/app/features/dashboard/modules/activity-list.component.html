@if (hasAny()) {
  <jh-card class="p-md" data-testid="activity">
    <h2 class="mb-sm text-body-sm font-semibold uppercase tracking-wide text-subtle">{{ 'home.activityTitle' | transloco }}</h2>
    <ul class="flex flex-col gap-xs">
      @for (row of rows(); track $index) {
        <li class="flex items-baseline gap-sm" [attr.data-kind]="row.kind">
          <span class="min-w-0 flex-1 text-body-sm text-muted">
            @if (row.route; as route) {
              <a [routerLink]="route" class="hover:text-link">{{ row.text }}</a>
            } @else {
              {{ row.text }}
            }
          </span>
          <span class="shrink-0 text-caption text-subtle">{{ row.time }}</span>
        </li>
      }
    </ul>
  </jh-card>
}
