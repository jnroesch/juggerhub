@if (policy()) {
  <ul class="mt-sm space-y-xs text-body-sm" data-testid="password-rules">
    @for (rule of rules(); track rule.key) {
      <li
        class="flex items-center gap-xs"
        [class.text-success-fg]="rule.met"
        [class.text-muted]="!rule.met"
      >
        <jh-icon [name]="rule.met ? 'check' : 'circle'" size="sm" class="shrink-0" />
        <span>{{ rule.key | transloco:rule.params }}</span>
      </li>
    }
  </ul>
}
