<label class="jh-lang">
  <span class="sr-only">{{ 'common.language' | transloco }}</span>
  <jh-icon name="globe" size="sm" class="jh-lang__icon" />
  <select
    class="jh-lang__select"
    [attr.aria-label]="'common.language' | transloco"
    [value]="current()"
    (change)="onChange($event)"
    data-testid="language-switcher"
  >
    @for (lang of languages; track lang) {
      <option [value]="lang" [selected]="lang === current()">{{ endonyms[lang] }}</option>
    }
  </select>
</label>
