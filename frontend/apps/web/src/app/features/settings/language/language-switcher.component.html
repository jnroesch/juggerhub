<label class="jh-lang">
  <span class="sr-only">{{ 'common.language' | transloco }}</span>
  <svg class="jh-lang__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="10"></circle>
    <path d="M2 12h20"></path>
    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
  </svg>
  <select
    class="jh-lang__select"
    [attr.aria-label]="'common.language' | transloco"
    [value]="current()"
    (change)="onChange($event)"
    data-testid="language-switcher"
  >
    @for (lang of languages; track lang) {
      <option [value]="lang" [selected]="lang === current()">{{ endonyms[lang] }}</option>
    }
  </select>
</label>
