<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JuggerHub</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The same mark as juggerhub.com. SVG for every browser that supports it; the .ico (16/32/48,
         rasterised from the SVG) is the fallback. sizes="32x32" keeps Chrome from preferring the
         .ico over the SVG. -->
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <!-- PWA shell (feature 054): the manifest makes every route installable; theme-color is
         DESIGN surface-card, the colour of the top and bottom bars, same as the manifest's.
         iOS takes the Home Screen icon from apple-touch-icon, not from the manifest, and paints
         transparent pixels black — hence the opaque 180×180 render. The viewport meta above is
         deliberately left without viewport-fit=cover (see specs/054-pwa-shell/research.md, R6). -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  </head>
  <body>
    <jh-root></jh-root>
  </body>
</html>
